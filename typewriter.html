<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,
  initial-scale=1">
<title>Typewriter</title>
<style>
body{background:#111;color:#0f0;
  font-family:monospace;
  padding:30px}
body.compact{padding:12px}
h2{color:#0f0}
a{color:#0f0}
input,textarea{background:#000;
  color:#0f0;border:1px solid #0f0;
  padding:6px 10px;
  font-family:monospace}
input{width:140px}
textarea{width:100%;height:80px;
  box-sizing:border-box;
  margin-top:8px;resize:vertical}
button{background:#000;color:#0f0;
  border:1px solid #0f0;
  padding:8px 16px;
  font-family:monospace;
  margin-top:10px;cursor:pointer}
button:hover{background:#0f0;
  color:#000}
#prev{margin-top:16px;
  font-size:1.2rem;color:#ff0;
  min-height:1.5em;
  word-break:break-word}
#cur{color:#ff0;
  animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#st{margin-top:10px;
  font-size:13px;color:#888}
#url{margin-top:14px;
  font-size:13px;color:#888;
  word-break:break-all}
</style>
</head>
<body>

<h2 id="ttl">▌ Typewriter</h2>
<p><a href="/" id="back"></a></p>

<label id="sidLbl">sid:
  <input id="sid"
    inputmode="numeric"
    placeholder="12345">
</label>

<br><textarea id="txt">
</textarea>

<button id="send"></button>
<div id="st"></div>

<div id="prev"></div>
<span id="cur">▌</span>

<div id="url"></div>

<script>
"use strict";
var LANG =
  localStorage.getItem("lang")
  || "ru";
var T = {
  ru: {
    ttl: "▌ Typewriter",
    back: "← на главную",
    sid: "sid:",
    txt: "текст для игры",
    send: "Отправить",
    bad: "sid — только цифры",
    go: "отправка…",
    ok: "отправлено ✔",
    fail: "ошибка отправки",
    down: "сервер недоступен",
    url: "HTTP Transmitter: "
  },
  en: {
    ttl: "▌ Typewriter",
    back: "← back to home",
    sid: "sid:",
    txt: "text for the game",
    send: "Send",
    bad: "sid — digits only",
    go: "sending…",
    ok: "sent ✔",
    fail: "send error",
    down: "server unavailable",
    url: "HTTP Transmitter: "
  }
}[LANG];

document.documentElement.lang = LANG;
document.getElementById("ttl")
  .textContent = T.ttl;
document.getElementById("back")
  .textContent = T.back;
document.getElementById("sidLbl")
  .firstChild.textContent = T.sid
    + " ";
document.getElementById("txt")
  .placeholder = T.txt;
document.getElementById("send")
  .textContent = T.send;
document.getElementById("url")
  .textContent = T.url +
  location.origin +
  "/text?sid=ваш-сид";

var sidEl =
  document.getElementById("sid");
var txtEl =
  document.getElementById("txt");
var stEl =
  document.getElementById("st");
var prevEl =
  document.getElementById("prev");
var curEl =
  document.getElementById("cur");
var SPEED = parseInt(
  localStorage.getItem("type_speed")
  || "60", 10);
var timer = null;

curEl.style.display = "none";

document.getElementById("send")
  .addEventListener("click",
    function () {
      var sid = sidEl.value.trim();
      if (!/^\d+$/.test(sid)) {
        stEl.textContent = T.bad;
        return;
      }
      stEl.textContent = T.go;
      fetch("/api/send", {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          sid: sid,
          text: txtEl.value
        })
      })
      .then(function (r) {
        if (r.ok) {
          stEl.textContent = T.ok;
          typeOut(txtEl.value);
        } else {
          stEl.textContent = T.fail;
        }
      })
      .catch(function () {
        stEl.textContent = T.down;
      });
    });

function typeOut(t) {
  clearInterval(timer);
  prevEl.textContent = "";
  curEl.style.display = "inline";
  var i = 0;
  timer = setInterval(function () {
    i = i + 1;
    prevEl.textContent = t.slice(0, i);
    if (i >= t.length) {
      clearInterval(timer);
      curEl.style.display = "none";
    }
  }, SPEED);
}

if (localStorage.getItem("compact")
    === "1") {
  document.body.className =
    "compact";
}
</script>
</body>
</html>
