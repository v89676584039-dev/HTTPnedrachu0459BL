<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,
  initial-scale=1">
<title>Home</title>
<style>
body{background:#111;color:#0f0;
  font-family:monospace;
  padding:30px}
body.compact{padding:12px}
h2{color:#0f0}
a{color:#0f0}
.dim{color:#888;font-size:13px}
.menu a{display:block;color:#0f0;
  border:1px solid #0f0;
  padding:10px;margin:8px 0;
  text-decoration:none}
.menu a:hover{background:#0f0;
  color:#000}
</style>
</head>
<body>

<h2 id="ttl">▌ Главная</h2>
<p class="dim" id="sub"></p>

<div class="menu" id="menu"></div>

<p class="dim" id="hint"></p>

<script>
"use strict";
// путь к аниматору — файл
// editor.html лежит рядом
// с index.html и открывается
// по /editor
var EDITOR_URL = "/editor";

var LANG =
  localStorage.getItem("lang")
  || "ru";
var T = {
  ru: {
    ttl: "▌ Главная",
    sub: "инструменты и API" +
      " для Build Logic :)",
    g1: "── API ──",
    tw: "Typewriter — отправка" +
      " текста в игру",
    ck: "Real-time Clock API" +
      " — часы",
    g2: "── Инструменты ──",
    ed: "Аниматор — кадры" +
      " для панели RGB2",
    rc: "Приёмник — просмотр" +
      " по сиду",
    g3: "── Прочее ──",
    st: "Настройки",
    hint: "в HTTP Transmitter" +
      " для текста вставьте адрес" +
      " вашего сайта + /text?sid=ваш-сид"
  },
  en: {
    ttl: "▌ Home",
    sub: "tools and API" +
      " for Build Logic :)",
    g1: "── APIs ──",
    tw: "Typewriter — send" +
      " text into the game",
    ck: "Real-time Clock API" +
      " — clock",
    g2: "── Tools ──",
    ed: "Animator — frames" +
      " for the RGB2 panel",
    rc: "Receiver — view by sid",
    g3: "── Misc ──",
    st: "Settings",
    hint: "in HTTP Transmitter" +
      " use your site address" +
      " + /text?sid=your-sid"
  }
}[LANG];

document.documentElement.lang = LANG;
document.getElementById("ttl")
  .textContent = T.ttl;
document.getElementById("sub")
  .textContent = T.sub;
document.getElementById("hint")
  .textContent = T.hint;

var menuEl =
  document.getElementById("menu");
[
  [null, T.g1],
  ["/typewriter", T.tw],
  ["/clock", T.ck],
  [null, T.g2],
  [EDITOR_URL, T.ed],
  ["/receiver", T.rc],
  [null, T.g3],
  ["/settings", T.st]
].forEach(function (m) {
  if (!m[0]) {
    var h =
      document.createElement("div");
    h.className = "dim";
    h.style.marginTop = "14px";
    h.textContent = m[1];
    menuEl.appendChild(h);
    return;
  }
  var a =
    document.createElement("a");
  a.href = m[0];
  a.textContent = m[1];
  menuEl.appendChild(a);
});

if (localStorage.getItem("compact")
    === "1") {
  document.body.className =
    "compact";
}
</script>
</body>
</html>
