<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,
  initial-scale=1">
<title>Home</title>
<style>
body{background:#111;color:#0f0;
  font-family:monospace;
  padding:30px}
body.compact{padding:12px}
h2{color:#0f0}
a{color:#0f0}
.dim{color:#888;font-size:13px}
.menu a{display:block;color:#0f0;
  border:1px solid #0f0;
  padding:10px;margin:8px 0;
  text-decoration:none}
.menu a:hover{background:#0f0;
  color:#000}
</style>
</head>
<body>

<h2 id="ttl">▌ Главная</h2>
<p class="dim" id="sub"></p>

<div class="menu" id="menu"></div>

<p class="dim" id="hint"></p>

<script>
"use strict";
var LANG =
  localStorage.getItem("lang")
  || "ru";
var T = {
  ru: {
    ttl: "▌ Главная",
    sub: "инструменты и API" +
      " для Build Logic :)",
    tw: "Typewriter — отправка" +
      " текста в игру",
    ck: "Real-time Clock API" +
      " — часы",
    rc: "Приёмник — просмотр" +
      " по сиду",
    st: "Настройки",
    hint: "в HTTP Transmitter" +
      " для текста вставьте адрес" +
      " вашего сайта + /text?sid=ваш-сид"
  },
  en: {
    ttl: "▌ Home",
    sub: "tools and API" +
      " for Build Logic :)",
    tw: "Typewriter — send" +
      " text into the game",
    ck: "Real-time Clock API" +
      " — clock",
    rc: "Receiver — view by sid",
    st: "Settings",
    hint: "in HTTP Transmitter" +
      " use your site address" +
      " + /text?sid=your-sid"
  }
}[LANG];

document.documentElement.lang = LANG;
document.getElementById("ttl")
  .textContent = T.ttl;
document.getElementById("sub")
  .textContent = T.sub;
document.getElementById("hint")
  .textContent = T.hint;

var menuEl =
  document.getElementById("menu");
[
  ["/typewriter", T.tw],
  ["/clock", T.ck],
  ["/receiver", T.rc],
  ["/settings", T.st]
].forEach(function (m) {
  var a =
    document.createElement("a");
  a.href = m[0];
  a.textContent = m[1];
  menuEl.appendChild(a);
});

if (localStorage.getItem("compact")
    === "1") {
  document.body.className =
    "compact";
}
</script>
</body>
</html>
