<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,
  initial-scale=1">
<title>Приёмник</title>
<style>
body{background:#111;color:#0f0;
  font-family:monospace;
  padding:30px}
body.compact{padding:12px}
h2{color:#0f0}
a{color:#0f0}
input{background:#000;color:#0f0;
  border:1px solid #0f0;
  padding:6px 10px;width:140px;
  font-family:monospace}
#val{margin-top:16px;
  font-size:1.2rem;color:#ff0;
  word-break:break-word;
  min-height:1.5em}
#cur{color:#ff0;
  animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#txt{margin-top:8px;
  font-size:14px;
  white-space:pre-wrap}
#st{margin-top:10px;
  font-size:13px;color:#888}
</style>
</head>
<body>

<h2 id="ttl">▌ Приёмник</h2>
<p><a href="/" id="back"></a></p>

<label id="sidLbl">sid:
  <input id="sid"
    inputmode="numeric"
    placeholder="12345">
</label>

<div id="st"></div>
<div id="val"></div>
<span id="cur">▌</span>
<div id="txt"></div>

<script>
"use strict";
var LANG =
  localStorage.getItem("lang")
  || "ru";
var T = {
  ru: {
    ttl: "▌ Приёмник",
    back: "← на главную",
    sid: "sid:",
    wait: "ожидание…",
    enter: "введите sid…",
    match: "совпадение ✔",
    none: "по этому сиду" +
      " пока ничего нет",
    down: "сервер недоступен",
    upd: "обновлено: "
  },
  en: {
    ttl: "▌ Receiver",
    back: "← back to home",
    sid: "sid:",
    wait: "waiting…",
    enter: "enter sid…",
    match: "match ✔",
    none: "nothing here yet" +
      " for this sid",
    down: "server unavailable",
    upd: "updated: "
  }
}[LANG];

document.documentElement.lang = LANG;
document.getElementById("ttl")
  .textContent = T.ttl;
document.getElementById("back")
  .textContent = T.back;
document.getElementById("sidLbl")
  .firstChild.textContent = T.sid
    + " ";

var sidEl =
  document.getElementById("sid");
var stEl =
  document.getElementById("st");
var valEl =
  document.getElementById("val");
var curEl =
  document.getElementById("cur");
var txtEl =
  document.getElementById("txt");
var SPEED = parseInt(
  localStorage.getItem("type_speed")
  || "60", 10);
var lastSid = "";
var shownText = "";
var timer = null;

curEl.style.display = "none";
stEl.textContent = T.wait;

function clearScreen() {
  clearInterval(timer);
  valEl.textContent = "";
  curEl.style.display = "none";
  txtEl.textContent = "";
  shownText = "";
}

function typeText(t, when) {
  clearInterval(timer);
  valEl.textContent = "";
  curEl.style.display = "inline";
  txtEl.textContent = "";
  var i = 0;
  timer = setInterval(function () {
    i = i + 1;
    valEl.textContent = t.slice(0, i);
    if (i >= t.length) {
      clearInterval(timer);
      curEl.style.display = "none";
      txtEl.textContent = T.upd + when;
    }
  }, SPEED);
}

function poll() {
  var mine = sidEl.value.trim();
  fetch("/api/data?sid="
    + encodeURIComponent(mine))
    .then(function (r) {
      return r.json();
    })
    .then(function (d) {
      if (!mine) {
        stEl.textContent = T.enter;
        clearScreen();
        lastSid = "";
        return;
      }
      if (d.sid && d.sid === mine) {
        if (d.sid !== lastSid) {
          stEl.textContent =
            T.match;
        }
        lastSid = d.sid;
        if ((d.text || "") !==
            shownText) {
          shownText = d.text || "";
          typeText(shownText,
            d.sid_at || "");
        }
      } else {
        stEl.textContent = T.none;
        clearScreen();
        lastSid = "";
      }
    })
    .catch(function () {
      stEl.textContent = T.down;
    });
}

setInterval(poll, 2000);
poll();
sidEl.addEventListener("input",
  poll);

if (localStorage.getItem("compact")
    === "1") {
  document.body.className =
    "compact";
}
</script>
</body>
</html>
