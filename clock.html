<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,
  initial-scale=1">
<title>Clock API</title>
<style>
body{background:#111;color:#0f0;
  font-family:monospace;
  padding:30px}
body.compact{padding:12px}
h2{color:#0f0}
a{color:#0f0}
.dim{color:#888;font-size:13px}
li{margin:8px 0}
</style>
</head>
<body>

<h2>▌ Real-time Clock API</h2>
<p><a href="/">← на главную</a></p>

<p class="dim">каждый адрес отдаёт
  только число — вставляйте в
  HTTP Transmitter как есть</p>

<ul id="list"></ul>

<p class="dim">часовой пояс:
  добавьте к адресу ?offset=N
  (в Краснодаре UTC+3 — offset=3),
  либо передайте заголовок
  offset: N</p>

<div id="now" class="dim"></div>

<script>
"use strict";
var base = location.origin;
var listEl =
  document.getElementById("list");
var nowEl =
  document.getElementById("now");
[
  ["часы", "/clock/hours"],
  ["минуты", "/clock/minutes"],
  ["секунды", "/clock/seconds"]
].forEach(function (r) {
  var li =
    document.createElement("li");
  li.textContent =
    r[0] + ": " + base + r[1];
  listEl.appendChild(li);
});

function tick() {
  var n = new Date();
  var p = function (v) {
    return (v < 10 ? "0" : "") + v;
  };
  nowEl.textContent =
    "сейчас: " + p(n.getHours()) +
    ":" + p(n.getMinutes()) +
    ":" + p(n.getSeconds()) +
    " (по вашему браузеру)";
}
setInterval(tick, 1000);
tick();

if (localStorage.getItem("compact")
    === "1") {
  document.body.className =
    "compact";
}
</script>
</body>
</html>
