<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,
  initial-scale=1">
<title>Clock API</title>
<style>
body{background:#111;color:#0f0;
  font-family:monospace;
  padding:30px}
body.compact{padding:12px}
h2{color:#0f0}
a{color:#0f0}
.dim{color:#888;font-size:13px}
li{margin:8px 0}
</style>
</head>
<body>

<h2 id="ttl">▌ Real-time Clock API</h2>
<p><a href="/" id="back"></a></p>

<p class="dim" id="sub"></p>

<ul id="list"></ul>

<p class="dim" id="off"></p>

<div id="now" class="dim"></div>

<script>
"use strict";
var LANG =
  localStorage.getItem("lang")
  || "ru";
var T = {
  ru: {
    ttl: "▌ Real-time Clock API",
    back: "← на главную",
    sub: "каждый адрес отдаёт" +
      " только число — вставляйте в" +
      " HTTP Transmitter как есть",
    off: "часовой пояс: добавьте" +
      " к адресу ?offset=N" +
      " (в Краснодаре UTC+3 — offset=3)," +
      " либо передайте заголовок" +
      " offset: N",
    now: "сейчас: ",
    by: " (по вашему браузеру)",
    hrs: "часы",
    min: "минуты",
    sec: "секунды"
  },
  en: {
    ttl: "▌ Real-time Clock API",
    back: "← back to home",
    sub: "each address returns" +
      " just a number — paste it" +
      " into HTTP Transmitter as is",
    off: "time zone: add ?offset=N" +
      " to the address" +
      " (UTC+3 — offset=3)," +
      " or send header offset: N",
    now: "now: ",
    by: " (your browser time)",
    hrs: "hours",
    min: "minutes",
    sec: "seconds"
  }
}[LANG];

document.documentElement.lang = LANG;
document.getElementById("ttl")
  .textContent = T.ttl;
document.getElementById("back")
  .textContent = T.back;
document.getElementById("sub")
  .textContent = T.sub;
document.getElementById("off")
  .textContent = T.off;

var base = location.origin;
var listEl =
  document.getElementById("list");
var nowEl =
  document.getElementById("now");
[
  [T.hrs, "/clock/hours"],
  [T.min, "/clock/minutes"],
  [T.sec, "/clock/seconds"]
].forEach(function (r) {
  var li =
    document.createElement("li");
  li.textContent =
    r[0] + ": " + base + r[1];
  listEl.appendChild(li);
});

function tick() {
  var n = new Date();
  var p = function (v) {
    return (v < 10 ? "0" : "") + v;
  };
  nowEl.textContent =
    T.now + p(n.getHours()) +
    ":" + p(n.getMinutes()) +
    ":" + p(n.getSeconds()) + T.by;
}
setInterval(tick, 1000);
tick();

if (localStorage.getItem("compact")
    === "1") {
  document.body.className =
    "compact";
}
</script>
</body>
</html>
